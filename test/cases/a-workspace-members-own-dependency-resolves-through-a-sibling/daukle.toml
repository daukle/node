schema = 1
project = "daukle/node-test"
version = "1.0.0"

[modules]

[plugins]
node = "./plugins/node"

[toolchains.node]
version = "26.3.1"

[toolchains.node.scripts]
debug = { node = ["-e", "console.log('debug is a ' + typeof require('debug'))"] }

[toolchains.node.workspace.members]
"packages/a" = "node-packages-a"
"packages/b" = "node-packages-b"

[toolchains.node-packages-a]
version = "26.3.1"
workspace = "node"
toolchain = "node"
dir = "packages/a"

[toolchains.node-packages-a.packages]
ms = "2.1.3"

[toolchains.node-packages-b]
version = "26.3.1"
workspace = "node"
toolchain = "node"
dir = "packages/b"

[toolchains.node-packages-b.scripts]
check = { node = ["-e", "console.log('from ' + require('a'), require('./index.js'))"] }

[toolchains.node-packages-b.packages]
a = "workspace:*"
semver = "7.6.3"
