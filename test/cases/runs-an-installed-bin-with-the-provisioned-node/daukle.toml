schema = 1
project = "daukle/node-test"
version = "1.0.0"

[modules]

[plugins]
npm = { url = "https://github.com/daukle/npm/releases/download/2.1.0/plugin.lua", sha256 = "12d18faf6b72cffc6da76afe678d231ee7820229f63fd466206021dd89a2d5f6" }
node = "./plugins/node"

# semver publishes its command as a bin MAP, so this exercises the branch that
# reads the field rather than the one that takes a bare string.
[toolchains.node]
version = ">=22.15.0"
entry = "src/main.mjs"

  [toolchains.npm]
  version = ">=22.15.0"

  [toolchains.npm.devPackages]
  semver = "7.6.3"

  [toolchains.node.scripts]
  check = { bin = "semver", args = ["-c", "1.2.3"] }
