schema = 1
project = "daukle/node-test"
version = "1.0.0"

[modules]

[plugins]
npm = { url = "https://github.com/daukle/npm/releases/download/2.1.0/plugin.lua", sha256 = "12d18faf6b72cffc6da76afe678d231ee7820229f63fd466206021dd89a2d5f6" }
node = "./plugins/node"

# jest 30 takes its rootDir from the nearest package.json and resolves through
# unrs-resolver, which is native, so both root entries are needed.
[toolchains.node]
version = "26.3.1"

  [toolchains.npm]
  version = "26.3.1"

  [toolchains.npm.packages]
  semver = "7.6.3"

  [toolchains.npm.devPackages]
  jest = "30.2.0"

  [toolchains.node.scripts]
  test = { bin = "jest", args = [] }
