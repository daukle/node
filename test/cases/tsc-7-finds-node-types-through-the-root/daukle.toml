schema = 1
project = "daukle/node-test"
version = "1.0.0"

[modules]

[plugins]
node = "./plugins/node"

# typescript 7 is a native compiler that resolves @types/node and reads "type"
# by walking up from the source file, so only the root entries can reach it.
[toolchains.node]
version = "26.3.1"
type = "module"

  [toolchains.node.devPackages]
  typescript = "7.0.2"
  "@types/node" = "20.19.43"

  [toolchains.node.scripts]
  build = [
    { bin = "typescript", binName = "tsc", args = ["-p", "."] },
    { module = "src/compiled.mjs" },
  ]
